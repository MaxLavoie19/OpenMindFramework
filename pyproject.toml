[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "openmind-framework"
version = "0.1.0"
description = "AI framework: MCTS agents with constraint satisfaction, outcome prediction and rule-based strategy"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Maxime Lavoie" }]
dependencies = ["numpy>=2.1", "scipy>=1.14"]

[project.scripts]
openmind-play = "openmind.entrypoint.play:main"
openmind-solve = "openmind.entrypoint.solve:main"
openmind-dashboard = "openmind.entrypoint.dashboard:main"
openmind-rerun-call = "openmind.entrypoint.rerun_call:main"

# OMF's example games, registered the way a project registers its own.
[project.entry-points."openmind.domains"]
tictactoe = "openmind.agent.factory.tictactoe_factory:declare_tictactoe_named"
sudoku = "openmind.agent.factory.sudoku_factory:declare_sudoku_named"
prisonersdilemma = "openmind.agent.factory.prisoners_dilemma_factory:declare_prisoners_dilemma_named"
rockpaperscissors = "openmind.agent.factory.rock_paper_scissors_factory:declare_rock_paper_scissors_named"

[dependency-groups]
dev = ["pytest>=9.1"]

[tool.hatch.build.targets.wheel]
packages = ["src/openmind"]
exclude = ["*_tests.py"]

[tool.pytest.ini_options]
testpaths = ["src", "test"]
python_files = ["*_tests.py"]
addopts = ["--import-mode=importlib"]
